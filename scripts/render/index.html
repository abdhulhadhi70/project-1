<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createStudio, enableShadows } from './studio.js';
import { SHOTS, placeCamera } from './shots.js';

window.SHOT_IDS = SHOTS.map((s) => s.id);
window.renderShot = async (id, pixelRatio = 2) => {
  const s = SHOTS.find((x) => x.id === id);
  if (!s) throw new Error('unknown shot ' + id);
  const width = s.width ?? 1200, height = s.height ?? 1500;
  const canvas = document.getElementById('c');
  const { renderer, scene, camera, key, contact } = createStudio(canvas, { width, height, pixelRatio });
  camera.aspect = width / height;
  const target = s.target ?? [0, 0];
  placeCamera(camera, s.camera, target);
  key.target.position.set(target[0], 0, target[1]);
  contact.target.position.set(target[0], 0, target[1]);
  scene.add(contact.target);
  const piece = enableShadows(s.build());
  scene.add(piece);
  renderer.compile(scene, camera);
  if (s.dof) {
    // Shallow depth of field for the opening image only: focus on one piece.
    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
    const { BokehPass } = await import('three/addons/postprocessing/BokehPass.js');
    const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
    const THREE = await import('three');
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const focus = camera.position.distanceTo(new THREE.Vector3(...s.dof.focusOn));
    composer.addPass(new BokehPass(scene, camera, { focus, aperture: s.dof.aperture, maxblur: s.dof.maxblur }));
    composer.addPass(new OutputPass());
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  const url = canvas.toDataURL('image/png');
  renderer.dispose();
  return url;
};
window.ready = true;
</script>
</body>
</html>
